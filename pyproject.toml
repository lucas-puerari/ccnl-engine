[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccnl-engine"
version = "0.6.0"
description = "Python engine for auditable Italian payroll simulations: CCNL-aware gross-to-net, employer cost, versioned rules, provenance and explicit scope."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lucas Puerari", email = "puerari.lucas@gmail.com" }]
keywords = ["ccnl", "payroll", "italy", "labor", "hrm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/lucas-puerari/ccnl-engine"
Repository = "https://github.com/lucas-puerari/ccnl-engine"
"Bug Tracker" = "https://github.com/lucas-puerari/ccnl-engine/issues"

[dependency-groups]
docs = [
    "mkdocstrings[python]>=0.27",
    "zensical>=0.0.11",
]
dev = [
    "bandit>=1.9.4",
    "complexipy>=8.0",
    "hatchling>=1.32.0",
    "hypothesis>=6.0",
    "mutmut>=3.8.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
preview = true
# Honour excludes even for paths passed explicitly (editors, hooks).
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "RUF201",  # rule-codes-in-selectors
    "COM812",  # missing-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation
    "TRY003",  # raise-vanilla-args
    "FBT",     # boolean positional args
    "PLR2004", # magic-value-comparison
    "S101",    # assert
    "RUF012",  # mutable-class-default
    "CPY001",  # missing-copyright-notice
    "D203",    # incorrect-blank-line-before-class (incompatible with D211)
    "D213",    # multi-line-summary-second-line (incompatible with D212)
    "D413",    # missing-blank-line-after-last-section
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0914", # too-many-locals
    "PLC2701", # import-private-name
    "RUF105",  # noqa-comments — project uses # noqa style
]

[tool.ruff.lint.pylint]
# Hard limits of the structural rules (docs/engine/architecture.md).
max-statements = 40
max-public-methods = 15

[tool.ruff.lint.per-file-ignores]
# PLR6301: pytest methods don't need self
# pytest-fixture-autouse: autouse is intentional for per-test loader mocking
"tests/**" = ["S", "ARG", "SLF001", "PLR6301", "pytest-fixture-autouse", "INP001"]
# Examples and demo: print is intentional, late imports are illustrative, line length is secondary.
"docs/examples/**" = ["T201", "E402", "RUF100", "I001", "E501", "N999", "RUF010", "D100"]
"demo/**" = ["T201", "E402", "RUF100", "I001", "E501", "N999", "RUF010", "INP001", "ARG", "F841", "C901", "TRY301", "SIM102", "PLR6201", "DOC501", "DOC502", "PLW0717"]
# Doc tooling: not a package (INP001); scripts print progress (T201).
"docs/*.py" = ["INP001"]
"scripts/**/*.py" = ["INP001", "T201"]
# Pydantic needs runtime access to annotated types; TCH001-TCH003 would move
# them to TYPE_CHECKING blocks, breaking model_validate and field resolution.
# Applies to Pydantic model files and types.py (Bracket is a dataclass
# whose field types Pydantic resolves at runtime via get_type_hints).
"src/ccnl_engine/tax/annual/models.py" = ["TCH"]
"src/ccnl_engine/agreement/**" = ["TCH"]
"src/ccnl_engine/catalog/**" = ["TCH"]
"src/ccnl_engine/event/**" = ["TCH"]
"src/ccnl_engine/extra_month/**" = ["TCH"]
"src/ccnl_engine/ledger/**" = ["TCH"]
"src/ccnl_engine/sickness/**" = ["TCH"]
"src/ccnl_engine/termination/**" = ["TCH"]
"src/ccnl_engine/withholding/**" = ["TCH"]
"src/ccnl_engine/family/**" = ["TCH"]
"src/ccnl_engine/irpef/**" = ["TCH"]
"src/ccnl_engine/regime/**" = ["TCH"]
"src/ccnl_engine/surtax/**" = ["TCH"]
"src/ccnl_engine/tax_credit/**" = ["TCH"]
"src/ccnl_engine/variable_pay/**" = ["TCH"]
"src/ccnl_engine/contribution/**" = ["TCH"]
"src/ccnl_engine/end_of_service/**" = ["TCH"]
"src/ccnl_engine/fund/**" = ["TCH"]
"src/ccnl_engine/pension_fund/**" = ["TCH"]
"src/ccnl_engine/severance/**" = ["TCH"]
"src/ccnl_engine/absence/**" = ["TCH"]
"src/ccnl_engine/apprenticeship/**" = ["TCH"]
"src/ccnl_engine/compensation/**" = ["TCH"]
"src/ccnl_engine/employer/**" = ["TCH"]
"src/ccnl_engine/employment/**" = ["TCH"]
"src/ccnl_engine/pay_item/**" = ["TCH"]
"src/ccnl_engine/seniority/**" = ["TCH"]
"src/ccnl_engine/working_time/**" = ["TCH"]
"src/ccnl_engine/payroll/**" = ["TCH"]
"src/ccnl_engine/provenance/ruleset/models.py" = ["TCH"]
"src/ccnl_engine/types.py" = ["TCH"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Preview mode formats Python fences inside Markdown and rewrites the
# pymdownx.snippets include marker into an arithmetic expression, which
# breaks every include. Markdown is never formatted by ruff.
exclude = ["*.md"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --cov=src/ccnl_engine --cov-report=term-missing --cov-report=xml --cov-fail-under=100 -q"
markers = [
    "legal_scenario: end-to-end scenario checked against an independent legal oracle",
]
filterwarnings = [
    "error::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/ccnl_engine"]
branch = true

[tool.coverage.report]
include_namespace_packages = true
show_missing = true
skip_covered = false
exclude_also = [
    "assert_never\\(",
]

# ---------------------------------------------------------------------------
# Bandit — SAST
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
severity = "medium"   # report medium and above
confidence = "medium" # report medium and above
exclude_dirs = [".venv"]

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["src", "."]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Hatchling — wheel packaging
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/ccnl_engine"]
# Plain .json files are excluded from the wheel; the build hook (hatch_build.py)
# injects compressed .json.gz variants instead. Editable installs read .json
# directly via the fallback path in read_bundled().
exclude = [
    "src/ccnl_engine/knowledge/**/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/Makefile",
    "/scripts/distribution/",
]
exclude = [".complexipy_cache", "**/__pycache__"]

[tool.hatch.build.hooks.custom]
path = "scripts/distribution/build.py"

# ---------------------------------------------------------------------------
# mutmut — Mutation Testing
# ---------------------------------------------------------------------------
[tool.mutmut]
source_paths = [
    "src/ccnl_engine/contribution/rules.py",
    "src/ccnl_engine/irpef/rules.py",
    "src/ccnl_engine/irpef/deduction/rules.py",
    "src/ccnl_engine/ledger/models.py",
    "src/ccnl_engine/pay_item/rounding/policies.py",
    "src/ccnl_engine/payroll/assurance/rules_assessment.py",
    "src/ccnl_engine/payroll/capability/rules_requirement.py",
    "src/ccnl_engine/tax_credit/trattamento_integrativo/rules.py",
    "src/ccnl_engine/irpef/net/rules.py",
    "src/ccnl_engine/contribution/additional_ivs/rules.py",
    "src/ccnl_engine/contribution/minimum_base/rules.py",
    "src/ccnl_engine/withholding/rules.py",
]
# Limit collection to the tests of the mutated payroll modules; copy full src
# so imports resolve. Hypothesis tests are left out: they use multiple
# executors and are incompatible with fork mode.
pytest_add_cli_args_test_selection = [
    "tests/unit/ccnl_engine/employment/inputs/test_inputs.py",
    "tests/unit/ccnl_engine/family/test_inputs.py",
    "tests/unit/ccnl_engine/ledger/test_models.py",
    "tests/unit/ccnl_engine/pay_item/facade/test_facade.py",
    "tests/unit/ccnl_engine/pay_item/rounding/test_policies.py",
    "tests/unit/ccnl_engine/pay_item/treatment/test_types.py",
    "tests/unit/ccnl_engine/contribution/rules/test_rules.py",
    "tests/unit/ccnl_engine/contribution/rules/test_ceiling.py",
    "tests/unit/ccnl_engine/contribution/rate/test_rules.py",
    "tests/unit/ccnl_engine/irpef/rules/test_irpef.py",
    "tests/unit/ccnl_engine/tax_credit/test_rules.py",
    "tests/unit/ccnl_engine/irpef/rules/test_irpef_mutation_sentinels.py",
    "tests/integration/ccnl_engine/family/ascendant/test_rules.py",
    "tests/integration/ccnl_engine/family/child/test_rules.py",
    "tests/integration/ccnl_engine/family/deduction/test_rules.py",
    "tests/integration/ccnl_engine/family/spouse/test_rules.py",
    "tests/integration/ccnl_engine/irpef/test_rules.py",
    "tests/unit/ccnl_engine/irpef/deduction/test_rules.py",
    "tests/unit/ccnl_engine/payroll/assurance/test_rules_assessment.py",
    "tests/unit/ccnl_engine/payroll/assurance/test_rules_assessment_readiness.py",
    "tests/unit/ccnl_engine/payroll/capability/test_rules_requirement.py",
    "tests/unit/ccnl_engine/tax_credit/trattamento_integrativo/test_rules.py",
    "tests/unit/ccnl_engine/irpef/net/test_rules.py",
    "tests/integration/ccnl_engine/irpef/net/test_rules.py",
    "tests/unit/ccnl_engine/contribution/additional_ivs/test_rules.py",
    "tests/unit/ccnl_engine/contribution/minimum_base/test_rules.py",
    "tests/unit/ccnl_engine/contribution/minimum_base/models/test_run.py",
    "tests/unit/ccnl_engine/contribution/minimum_base/models/test_rule.py",
    "tests/unit/ccnl_engine/withholding/rules/test_period.py",
    "tests/unit/ccnl_engine/irpef/computation/test_services.py",
    "tests/unit/ccnl_engine/tax_credit/recovery/test_models.py",
    "tests/integration/ccnl_engine/payroll/period/test_services_pdr_trattamento.py",
    "tests/integration/ccnl_engine/payroll/period/test_services_fiscal_regime.py",
    "tests/integration/ccnl_engine/withholding/cap/services/test_cap.py",
    "tests/integration/ccnl_engine/withholding/cap/services/test_cap_credit_recovery.py",
    "tests/integration/ccnl_engine/withholding/deferral/services/test_deferral.py",
    "tests/integration/ccnl_engine/withholding/deferral/services/test_deferral_next_year.py",
    "tests/integration/ccnl_engine/withholding/plan/test_services.py",
    "tests/integration/ccnl_engine/tax_credit/somma_esente/services/test_somma_esente.py",
    "tests/integration/ccnl_engine/tax_credit/somma_esente/services/test_somma_esente_year.py",
]
pytest_add_cli_args = ["--no-cov"]
mutate_only_covered_lines = true
# Copy the full source tree so all test imports resolve inside mutants/.
also_copy = ["src"]
# Run in fork mode for speed (Python is imported once; workers are forked).
process_isolation = "fork"

# ---------------------------------------------------------------------------
# complexipy — Cognitive Complexity (SonarSource whitepaper v1.7)
# ---------------------------------------------------------------------------
[tool.complexipy]
max-complexity-allowed = 15
exclude = [".venv", "venv", "build", "dist", "demo"]
failed = true
