[project]
name = "ccnl-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # missing-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation
    "TRY003",  # raise-vanilla-args
    "FBT",     # boolean positional args
    "PLR2004", # magic-value-comparison
    "S101",    # assert — fine in tests
    "RUF012",  # mutable-class-default
    "CPY001",  # missing-copyright-notice
    "D413",    # missing-blank-line-after-last-section — unnecessary blank lines
    "PLR0913", # too-many-arguments — compute() has 8 args by spec
    "PLR0917", # too-many-positional-arguments — same
    "PLR0915", # too-many-statements — compute() is necessarily long
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "SLF001"]
# Pydantic needs runtime access to annotated types; TCH001-TCH003 would move
# them to TYPE_CHECKING blocks, breaking model_validate and field resolution.
# Applies only to files that define Pydantic models, not to engine code.
"src/ccnl_engine/models/**" = ["TCH"]
"src/ccnl_engine/tax/models.py" = ["TCH"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/ccnl_engine --cov-report=term-missing --cov-report=xml --cov-fail-under=100 -q"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/ccnl_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

# ---------------------------------------------------------------------------
# Bandit — SAST
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
severity = "medium"   # report medium and above
confidence = "medium" # report medium and above
exclude_dirs = [".venv"]

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Package data — include JSON files in wheel/sdist
# ---------------------------------------------------------------------------
[tool.setuptools.package-data]
"ccnl_engine" = ["data/*.json", "tax/data/*.json"]
