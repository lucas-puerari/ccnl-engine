[project]
name = "ccnl-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # missing-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation
    "TRY003",  # raise-vanilla-args
    "FBT",     # boolean positional args
    "PLR2004", # magic-value-comparison
    "S101",    # assert — fine in tests
    "RUF012",  # mutable-class-default
    "CPY001",  # missing-copyright-notice
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/ccnl_engine --cov-report=term-missing --cov-report=xml --cov-fail-under=100 -q"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/ccnl_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

# ---------------------------------------------------------------------------
# Bandit — SAST
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
severity = "medium"   # report medium and above
confidence = "medium" # report medium and above
exclude_dirs = [".venv"]

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
