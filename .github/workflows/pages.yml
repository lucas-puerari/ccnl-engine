name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # ── Demo ──────────────────────────────────────────────────────────────
      - name: "Demo: assemble"
        run: |
          mkdir -p _site/demo
          cp demo/index.html _site/demo/index.html
          cp demo/app.py     _site/demo/app.py
          cp _site/demo/index.html _site/index.html  # root redirect placeholder replaced below
          touch _site/.nojekyll

      - name: "Root: create landing page"
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=demo/" />
            <title>ccnl-engine</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 480px;
                     margin: 80px auto; padding: 0 16px; text-align: center; }
              a { color: #2563eb; }
            </style>
          </head>
          <body>
            <h1>ccnl-engine</h1>
            <p>
              <a href="demo/">Interactive demo</a> ·
              <a href="docs/">API documentation</a>
            </p>
          </body>
          </html>
          EOF

      # ── Docs ──────────────────────────────────────────────────────────────
      - name: "Docs: install dependencies"
        run: uv pip install --system -e . "zensical>=0.0.11" "mkdocstrings[python]>=0.27"

      - name: "Docs: build with Zensical"
        run: uv run zensical build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
