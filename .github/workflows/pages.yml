name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      # ── Demo ──────────────────────────────────────────────────────────────
      - name: "Demo: build wheel"
        run: uv build --wheel --out-dir demo/release/packages/

      # The browser runs the demo in Pyodide: load it there before deploying.
      - name: "Demo: smoke test in Pyodide"
        run: |
          npm install --no-save --prefix demo/release pyodide@0.27.0
          cp demo/smoke.mjs demo/release/smoke.mjs
          node demo/release/smoke.mjs demo/release/packages/*.whl demo/app.py

      - name: "Demo: assemble"
        run: |
          WHEEL_VERSION=$(uv version --short)
          WHEEL_BUILD=${GITHUB_SHA::12}
          mkdir -p "docs/_build/demo/wheels/${WHEEL_BUILD}" docs/_build/demo/i18n
          sed "s/WHEEL_VERSION/${WHEEL_VERSION}/g" demo/index.html > docs/_build/demo/index.html
          cp demo/app.py       docs/_build/demo/app.py
          cp demo/style.css    docs/_build/demo/style.css
          sed -e "s/WHEEL_VERSION/${WHEEL_VERSION}/g" -e "s/WHEEL_BUILD/${WHEEL_BUILD}/g" demo/ui.js > docs/_build/demo/ui.js
          cp demo/release/packages/*.whl "docs/_build/demo/wheels/${WHEEL_BUILD}/"
          cp demo/localization/*.json  docs/_build/demo/i18n/
          cp docs/_build/demo/index.html docs/_build/index.html  # root redirect placeholder replaced below
          touch docs/_build/.nojekyll

      - name: "Root: create landing page"
        run: |
          cat > docs/_build/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=demo/" />
            <title>ccnl-engine</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 480px;
                     margin: 80px auto; padding: 0 16px; text-align: center; }
              a { color: #2563eb; }
            </style>
          </head>
          <body>
            <h1>ccnl-engine</h1>
            <p>
              <a href="demo/">Demo</a> ·
              <a href="docs/">Documentation</a>
            </p>
          </body>
          </html>
          EOF

      # ── Coverage badge ────────────────────────────────────────────────────
      - name: "Badge: install test + badge deps"
        run: uv pip install --system -e . pytest pytest-cov hypothesis "genbadge[coverage]"

      - name: "Badge: run tests and collect coverage"
        run: |
          set -o pipefail
          python -m pytest --cov=ccnl_engine --cov-report=xml:coverage.xml -q \
            --no-header 2>&1 | tail -5

      - name: "Badge: generate SVG"
        run: genbadge coverage -i coverage.xml -o docs/_build/coverage-badge.svg

      # ── Docs ──────────────────────────────────────────────────────────────
      - name: "Docs: install dependencies"
        run: uv sync --locked --group docs

      - name: "Docs: generate coverage matrix"
        run: uv run python scripts/documentation/coverage_matrix/generate.py

      - name: "Docs: generate contract pages"
        run: uv run python scripts/documentation/contract_page/generate.py

      - name: "Docs: build with Zensical"
        run: uv run zensical build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
