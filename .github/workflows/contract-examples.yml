name: Contract examples

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ccnl_engine/knowledge/**"
      - "scripts/documentation/contract_example/generate.py"
      - "docs/examples/agreement/**"

concurrency:
  group: contract-examples-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-contract-examples:
    name: Verify docs/examples/agreement/ is up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --locked

      - name: Install package (editable)
        run: uv pip install -e .

      - name: Check contract examples are up to date
        run: uv run python scripts/documentation/contract_example/generate.py --check
