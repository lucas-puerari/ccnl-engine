name: Contract examples

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ccnl_engine/knowledge/contract/**"
      - "src/ccnl_engine/knowledge/social_security/**"
      - "scripts/docs/gen_contract_examples.py"
      - "docs/examples/contracts/**"

concurrency:
  group: contract-examples-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check-contract-examples:
    name: Verify docs/examples/contracts/ is up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync

      - name: Install package (editable)
        run: uv pip install -e .

      - name: Check contract examples are up to date
        run: uv run python scripts/docs/gen_contract_examples.py --check
