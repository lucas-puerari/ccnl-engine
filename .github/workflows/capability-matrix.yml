name: Capability matrix

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ccnl_engine/knowledge/**"
      - "scripts/provenance/rules.py"
      - "scripts/documentation/capability_matrix/generate.py"
      - "docs/contracts/capability-matrix.md"

concurrency:
  group: capability-matrix-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-capability-matrix:
    name: Verify docs/contracts/capability-matrix.md is up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --locked

      - name: Install package (editable)
        run: uv pip install -e .

      - name: Check capability matrix is up to date
        run: uv run python scripts/documentation/capability_matrix/generate.py --check
