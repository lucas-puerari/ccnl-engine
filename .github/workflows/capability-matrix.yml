name: Capability matrix

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ccnl_engine/knowledge/ccnl/**"
      - "src/ccnl_engine/knowledge/tax/**"
      - "src/ccnl_engine/knowledge/inps/**"
      - "src/ccnl_engine/knowledge/surtax/**"
      - "src/ccnl_engine/knowledge/capabilities/**"
      - "scripts/ci/payable_rules.py"
      - "scripts/docs/gen_capability_matrix.py"
      - "docs/contracts/capability-matrix.md"

concurrency:
  group: capability-matrix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check-capability-matrix:
    name: Verify docs/contracts/capability-matrix.md is up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync

      - name: Install package (editable)
        run: uv pip install -e .

      - name: Check capability matrix is up to date
        run: uv run python scripts/docs/gen_capability_matrix.py --check
