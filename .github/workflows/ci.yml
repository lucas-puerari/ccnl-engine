name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The same gates the release runs before it publishes.
  gates:
    uses: ./.github/workflows/quality-gates.yml

  # The check main requires: it passes only when every gate passed, so the
  # branch protection keeps its name while it covers all of them.
  required:
    name: Lint, typecheck, test
    needs: gates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every gate passed
        env:
          RESULT: ${{ needs.gates.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "The quality gates ended with: $RESULT"
            exit 1
          fi
