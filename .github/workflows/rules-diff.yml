name: Rules diff

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ccnl_engine/knowledge/**"

concurrency:
  group: rules-diff-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write   # post PR comment
  contents: read

jobs:
  rules-diff:
    name: Compute and post rules diff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history needed for git diff

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install package (editable)
        run: uv pip install -e .

      - name: Generate rules diff report
        id: diff
        run: |
          REPORT=$(uv run python scripts/ci/rules_diff_report.py \
            --base "${{ github.event.pull_request.base.sha }}")
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          echo "$REPORT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        env:
          DIFF_REPORT: ${{ steps.diff.outputs.report }}
        with:
          script: |
            const marker = '<!-- rules-diff -->';
            const body = `${marker}\n${process.env.DIFF_REPORT}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
