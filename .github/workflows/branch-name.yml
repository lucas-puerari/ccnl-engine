name: Branch name check

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          if ! echo "$BRANCH" | grep -qE '^(feature|fix|chore|ci|docs|refactor|perf|test|revert)/.+'; then
            echo "❌ Branch '$BRANCH' does not follow naming convention."
            echo "   Allowed prefixes: feature/, fix/, chore/, ci/, docs/, refactor/, perf/, test/, revert/"
            exit 1
          fi
