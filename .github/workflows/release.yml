name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 1. Validate the tag ─────────────────────────────────────────────────────
  validate:
    name: Validate the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "❌ Tagged commit $GITHUB_SHA is not an ancestor of origin/main"
            exit 1
          fi

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "❌ Tag v$TAG does not match package version $PKG"
            exit 1
          fi

  # ── 2. The gates of main, on the tagged commit ──────────────────────────────
  # Every gate a pull request runs, and the build of the distribution that
  # is smoke-tested on each supported Python and then published unchanged.
  gates:
    needs: validate
    uses: ./.github/workflows/quality-gates.yml

  # The full mutation campaign on the tagged commit: every money-path module
  # at 93% alone, on the code published, not on an older weekly run.
  mutation:
    needs: validate
    uses: ./.github/workflows/mutation.yml

  # ── 3. Publish to PyPI ───────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [gates, mutation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # PyPI Trusted Publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/p/ccnl-engine
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1

  # ── 4. GitHub Release ────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [gates, mutation, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0   # full history for release notes and rules diff

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install package (editable)
        run: uv pip install -e .

      - name: Download dist artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: dist
          path: dist/

      - name: Download the mutation campaign of the tagged commit
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: mutation-results
          path: mutants/

      # The dossier is attached to the release, so it outlives the CI
      # artifacts it gathers.
      - name: Build the validation dossier
        env:
          GATES: ${{ needs.gates.result }}
          MUTATION: ${{ needs.mutation.result }}
        run: >-
          python scripts/distribution/dossier/generate.py
          --gate "gates=$GATES" --gate "mutation=$MUTATION"
          --mutation mutants/mutation-score.json --out dossier/

      - name: Generate rules diff since previous release
        id: diff
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            echo "## Rules diff since $PREV" > rules_diff.md
            echo "" >> rules_diff.md
            uv run python scripts/knowledge/diff.py --since "$PREV" >> rules_diff.md
          else
            echo "" > rules_diff.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true
          body_path: rules_diff.md
          files: |
            dist/*
            dossier/dossier.json
            dossier/dossier.md
          fail_on_unmatched_files: true
