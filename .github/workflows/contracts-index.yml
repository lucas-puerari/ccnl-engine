name: Contracts index

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ccnl_engine/knowledge/contract/**"
      - "scripts/documentation/coverage/loaders.py"
      - "scripts/documentation/coverage_matrix/generate.py"
      - "docs/contracts/index.md"

concurrency:
  group: contracts-index-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-contracts-index:
    name: Verify docs/contracts/index.md is up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --locked

      - name: Install package (editable)
        run: uv pip install -e .

      - name: Check contracts index is up to date
        run: uv run python scripts/documentation/coverage_matrix/generate.py --check
