name: Contracts index

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ccnl_engine/knowledge/ccnl/**"
      - "scripts/docs/coverage_report.py"
      - "scripts/docs/gen_coverage_matrix.py"
      - "docs/contracts/index.md"

concurrency:
  group: contracts-index-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check-contracts-index:
    name: Verify docs/contracts/index.md is up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync

      - name: Install package (editable)
        run: uv pip install -e .

      - name: Check contracts index is up to date
        run: uv run python scripts/docs/gen_coverage_matrix.py --check
