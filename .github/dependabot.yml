version: 2
updates:
  # Titles are conventional: ci(deps) for the workflows, build(deps) for
  # the packages.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
      include: "scope"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    # Raise a lower bound only when the new version falls outside it: the
    # runtime floor of the package (e.g. pydantic>=2.6) must stay low enough
    # for the Pyodide demo, which ships an older pydantic.
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
