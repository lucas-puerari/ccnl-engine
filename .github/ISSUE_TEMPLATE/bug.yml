name: Bug
description: The engine computes, raises or reports something it should not.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Versions
      description: ccnl_engine.engine_version and ccnl_engine.bundle_version.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The request as JSON (request_to_json), without personal data.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened and what you expected
    validations:
      required: true
